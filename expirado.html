<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Acesso Expirado — Dashboard XPT</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(circle at top right, rgba(220,0,0,0.10), transparent 35%),
      radial-gradient(circle at bottom left, rgba(150,0,0,0.08), transparent 30%),
      #080808;
    color:#f5f5f5;
    text-align:center;
  }
  .box{
    padding:48px 40px;
    border:1px solid #242424;
    border-radius:20px;
    background:linear-gradient(145deg,#151515,#0c0c0c);
    box-shadow:0 10px 30px rgba(0,0,0,0.55);
    max-width:380px;
  }
  img{ height:52px; margin-bottom:18px; filter:drop-shadow(0 0 10px rgba(255,0,0,0.35)); }
  h1{
    font-size:22px;
    font-weight:700;
    margin-bottom:10px;
    background:linear-gradient(90deg,#ff1a1a,#b30000);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  p{ color:#999; font-size:14px; line-height:1.5; }
</style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Logo">
    <h1>⏰ Este acesso expirou</h1>
    <p>Fale com o responsável para liberar um novo período de acesso ao Dashboard Operacional.</p>
  </div>
</body>
</html>
